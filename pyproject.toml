[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactual-skill-transfer-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
